<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cook Partner Portal Login | InstantChef</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="chef-auth-body">

    <div class="chef-login-wrapper">
        <div class="brand-accent-line"></div>
        
        <div class="chef-card-inner">
            <div class="chef-auth-header">
                <a href="index.html" class="chef-back-home">
                    <i class="fa-solid fa-arrow-left"></i> Back to Homepage
                </a>
                <div class="chef-logo-icon">🍳</div>
                <h2>Partner Portal Login</h2>
                <p>Verify your credentials to turn on your live status and accept active party shifts nearby.</p>
            </div>

            <form id="interactive-login-form" class="chef-animated-form">
                
                <div class="chef-input-block">
                    <label for="login-identifier">Email Address or Mobile Number</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-id-card icon-decor"></i>
                        <input type="text" id="login-identifier" placeholder="chef.example@gmail.com or 98765..." required>
                    </div>
                </div>

                <div class="chef-input-block">
                    <label for="login-password">Portal Access Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock icon-decor"></i>
                        <input type="password" id="login-password" placeholder="Enter your secret portal password..." required>
                    </div>
                </div>

                <button type="submit" class="btn-chef-login-submit" id="submit-btn-lock">
                    <span class="btn-text-state">Verify Credentials & Go Live</span>
                    <span class="btn-loading-state"><i class="fa-solid fa-circle-notch fa-spin"></i> Authenticating Account...</span>
                </button>
            </form>
            
            <div class="chef-auth-footer">
                <p>New to the InstantChef app? <a href="signup.html" class="accent-redirect-link">Create a cook profile <i class="fa-solid fa-chevron-right"></i></a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
